name: crm

x-source: &source
  type: bind
  source: .
  target: /workspace

x-runtime: &runtime
  image: oven/bun:1.4.0
  working_dir: /workspace
  volumes:
    - *source

services:
  postgres:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    volumes:
      - crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 3s
      timeout: 5s
      retries: 20
    labels:
      base44.project: CRM
      base44.kind: infra

  install:
    <<: *runtime
    restart: "no"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
    command:
      [
        "sh",
        "-ec",
        "bun install --frozen-lockfile --linker=hoisted",
      ]
    labels:
      base44.project: CRM
      base44.kind: infra

  migrate:
    <<: *runtime
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
      ALLOW_REMOTE_DB: "1"
    command: ["sh", "-ec", "bun run --filter=@crm/db dev:prepare"]
    labels:
      base44.project: CRM
      base44.kind: infra

  seed:
    <<: *runtime
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
      ALLOW_REMOTE_DB: "1"
    command: ["sh", "-ec", "bun run --filter=@crm/db db:seed"]
    profiles: ["seed"]
    labels:
      base44.project: CRM
      base44.kind: infra

  api:
    <<: *runtime
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
      API_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      CRM_TELEMETRY_DISABLED: "1"
    command: ["sh", "-ec", "exec bun run --filter=api dev"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3001/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      base44.project: CRM API
      base44.kind: api
      base44.port: 3001

  app:
    <<: *runtime
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
      API_URL: http://api:3001
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      CRM_TELEMETRY_DISABLED: "1"
    command: ["sh", "-ec", "exec bun run --filter=app dev -- -H 0.0.0.0 -p 3000"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/sign-in');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 240s
    labels:
      base44.project: CRM
      base44.kind: web
      base44.port: 3000

volumes:
  crm-postgres:
